; HMI firmware for the Elecrow DLE06235B / ES3C35P ESP32-S3 display.
; The platform is pinned: espressif32 7.1.3 ships ESP-IDF 6.1.0. Do not float it.

[platformio]
default_envs = elecrow_s3

[env]
platform = espressif32@7.1.3
framework = espidf
monitor_speed = 115200

; Five-page HMI, ST77922 QSPI LCD and integrated capacitive touch.
[env:elecrow_s3]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions/elecrow_s3.csv
